spring:
  application:
    name: incident-pilot
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://127.0.0.1:15432/incident_pilot}
    username: ${POSTGRES_USER:incident_pilot}
    password: ${POSTGRES_PASSWORD:incident_pilot_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      timeout: 2s
      repositories:
        enabled: false
  flyway:
    enabled: true

incidentpilot:
  agent:
    max-steps: 5
    total-budget: 20s
    tool-timeout: 6s
    answer-reserve: 8s
    context-chars: 6000
    fact-chars: 600
    fact-lookback: 90d
  reliability:
    run-retention: 1h
    rate-permits: 20
    rate-window: 60s
    max-concurrent: 4
    concurrency-ttl: 2m
    sse-timeout: ${INCIDENTPILOT_SSE_TIMEOUT:35s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

server:
  address: ${SERVER_ADDRESS:127.0.0.1}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-none}]"
